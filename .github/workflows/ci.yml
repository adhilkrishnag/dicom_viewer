name: CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Validate package
        run: flutter pub publish --dry-run

  build-platforms:
    name: Build Example (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            build-cmd: flutter build web

          - platform: android
            os: ubuntu-latest
            build-cmd: flutter build apk --debug

          - platform: linux
            os: ubuntu-latest
            build-cmd: |
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
              flutter build linux --debug

          - platform: windows
            os: windows-latest
            build-cmd: flutter build windows --debug

          - platform: macos
            os: macos-latest
            build-cmd: flutter build macos --debug

          - platform: ios
            os: macos-latest
            build-cmd: flutter build ios --debug --no-codesign

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Example App
        working-directory: example
        run: |
          flutter pub get
          ${{ matrix.build-cmd }}
