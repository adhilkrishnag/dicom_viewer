name: dicom_viewer
description: >
  A pure-Dart, cross-platform DICOM viewer package for Flutter.
  Parses single-frame uncompressed DICOM files, applies windowing
  (contrast/brightness), and renders medical images — on Android,
  iOS, macOS, Windows, Linux, and Web from a single codebase with
  no native/FFI dependencies.
version: 0.1.0
homepage: https://github.com/adhilkrishnag/dicom_viewer
repository: https://github.com/adhilkrishnag/dicom_viewer

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

