name: dicom_viewer
description: >-
  A pure-Dart, cross-platform DICOM viewer for Flutter. Parses uncompressed DICOM files, applies windowing, and renders medical images across Web, Desktop, and Mobile.
version: 0.2.0
homepage: https://github.com/adhilkrishnag/dicom_viewer
repository: https://github.com/adhilkrishnag/dicom_viewer

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

